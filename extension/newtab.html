<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>New Tab</title>
  <link rel="stylesheet" href="newtab.css">
  <script src="paint.js"></script>
</head>
<body>
  <!-- No autofocus and no .focus() anywhere: the cursor must stay in the address bar. -->
  <iframe id="app" title="Dashboard" src="https://mrkiwisir.github.io/Custom-New-Browser-Tab/" allow="clipboard-read; clipboard-write" tabindex="-1"></iframe>
  <div id="offline" hidden>
    <span>Can't reach your dashboard. Check your internet connection.</span>
    <button id="retry" type="button">Try again</button>
  </div>
  <script src="newtab.js"></script>
</body>
</html>
